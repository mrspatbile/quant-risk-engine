[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-risk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "plotly",
    "jupyterlab",
    "ipykernel",
    "requests",
    "pyyaml",
    "yfinance",
    "pandas-datareader",
    "streamlit",
    "QuantLib",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]