[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-risk"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "plotly",
    "jupyterlab",
    "ipykernel",
    "requests",
    "pyyaml",
    "yfinance",
    "pandas-datareader",
    "streamlit",
    "QuantLib",
    "python-dotenv",
    "seaborn",
    "scikit-learn",
    "pyarrow",
    "python-json-logger",
]
[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]