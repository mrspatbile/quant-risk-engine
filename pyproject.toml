[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-risk"
version = "0.3.0"
requires-python = ">=3.13"
dependencies = [
    # core pricing engine — what src/quant_risk/ actually imports
    "numpy",
    "scipy",
    "pandas",
    "QuantLib",
    "requests",
    "python-dotenv",
    "python-json-logger",
    "pyyaml",
    # data layer (ExternalStore — yfinance, FF factors, GPR)
    "yfinance",
    "pandas-datareader",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
notebook = [
    # notebook tooling — not needed to use the library
    "jupyterlab",
    "ipykernel",
    "matplotlib",
    "plotly",
    "seaborn",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]